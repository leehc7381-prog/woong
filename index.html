<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영웅이노트">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<title>영웅이 육아노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one mobile-first column (max 720px). Header with D-day, category rail, tip cards; a bottom sheet for adding tips. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --surface-2: #F6F9F8;
  --ink: #1D2925;
  --muted: #5B6A65;
  --line: #D6E0DC;
  --accent: #23735F;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EBE4;
  --yolk: #F2C14E;
  --yolk-soft: #FBEFCB;
  --danger: #B3412F;
  --shadow: 0 1px 2px rgba(29,41,37,.06), 0 6px 20px rgba(29,41,37,.06);
  --f-display: "Gowun Dodum", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --c-docs: #4C6FD1; --c-feed: #D9822B; --c-sleep: #6B5BB5; --c-bath: #2A9BB8;
  --c-clean: #5C8F3A; --c-play: #D2557A; --c-health: #C0463A; --c-gear: #8A6D3B; --c-mom: #A35BA0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121917; --surface: #1A2421; --surface-2: #1F2B28; --ink: #E6EEEB; --muted: #9CADA7;
    --line: #2E3D39; --accent: #5BC1A4; --accent-ink: #0E1A16; --accent-soft: #1F3A33;
    --yolk: #F2C14E; --yolk-soft: #3A3220; --danger: #EE806C;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --c-docs: #8EA8F0; --c-feed: #F0A75E; --c-sleep: #A898E8; --c-bath: #6CC9E0;
    --c-clean: #93C46F; --c-play: #F08AA8; --c-health: #F0897C; --c-gear: #CDAE78; --c-mom: #D995D6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121917; --surface: #1A2421; --surface-2: #1F2B28; --ink: #E6EEEB; --muted: #9CADA7;
  --line: #2E3D39; --accent: #5BC1A4; --accent-ink: #0E1A16; --accent-soft: #1F3A33;
  --yolk: #F2C14E; --yolk-soft: #3A3220; --danger: #EE806C;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --c-docs: #8EA8F0; --c-feed: #F0A75E; --c-sleep: #A898E8; --c-bath: #6CC9E0;
  --c-clean: #93C46F; --c-play: #F08AA8; --c-health: #F0897C; --c-gear: #CDAE78; --c-mom: #D995D6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.gear { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-size: .85rem; }
.top-right { display: flex; gap: 6px; align-items: center; flex: none; }
.top { flex-wrap: nowrap !important; }
.logo { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--muted); padding: 0; }
.view { display: grid; gap: 16px; }
.sec { display: grid; gap: 8px; }
.sec-h h2 { font-size: 1.05rem !important; }
.favs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.favs::-webkit-scrollbar { display: none; }
.fav { flex: none; width: 116px; display: grid; gap: 6px; text-align: left; border: 0; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.fav .tt { font-size: .8rem; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 0 2px 2px; }
.fav .th { width: 100%; aspect-ratio: 1; border-radius: 10px; }
.stages { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.stages::-webkit-scrollbar { display: none; }
.stage { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .8rem; display: inline-flex; gap: 5px; align-items: center; }
.stage[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stage .now { font-size: .65rem; background: var(--yolk); color: #1D2925; border-radius: 6px; padding: 0 5px; font-weight: 700; }
.all-btn { width: 100%; }
.all-h { display: flex; align-items: center; gap: 8px; }
.all-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; margin: 0; }
.tcard { display: block; text-align: left; border: 0; width: 100%; background: none; padding: 10px 14px; border-top: 1px solid var(--line); }
.tcard:first-of-type { border-top: 0; }
.group { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; border-left: 4px solid var(--cc, var(--accent)); }
.group-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px 4px; }
.group-h h3 { margin: 0; font-size: .9rem; color: var(--cc, var(--accent)); }
.group-h small { color: var(--muted); font-size: .75rem; }
.groups { display: grid; gap: 10px; }
.cat.fav-t { --cc: var(--yolk); }
.cat .ic { font-size: 1rem; line-height: 1; }
.tcard .th { width: 60px; height: 60px; border-radius: 10px; }
.tcard .bd { display: grid; gap: 2px; min-width: 0; }
.tcard .mt .sub { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tcard .mt .star { color: var(--yolk); }
.tcard .mt { display: flex; gap: 6px; align-items: center; font-size: .72rem; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.tcard .mt .cl { color: var(--cc); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.tcard h3 { margin: 0; font-size: .95rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tcard p { margin: 0; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
img.th { object-fit: cover; display: block; background: var(--surface-2); }
.th.ph { display: grid; place-items: center; background: color-mix(in srgb, var(--cc, var(--accent)) 16%, var(--surface)); color: var(--cc, var(--accent)); font-family: var(--f-display); font-size: 1.5rem; }
.fav .th.ph { font-size: 2rem; }
.more-stage { justify-self: start; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.tab { text-align: center; padding: 7px 0; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .9rem; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.grow-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.grow-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; margin: 0; }
.grow-h small { color: var(--muted); }
.gcard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.gcard h3 { margin: 0; font-size: 1.02rem; }
.gcard-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gcard-h small { color: var(--muted); }
.sexpick { display: flex; gap: 4px; }
.sexpick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 12px; font-size: .8rem; }
.sexpick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.metrics.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.metric .n { font-size: .72rem; color: var(--muted); line-height: 1.35; }
.metric .warn { color: var(--danger); }
.daynav { display: flex; align-items: center; gap: 6px; font-size: .85rem; }
.daynav button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 50%; font-size: 1rem; line-height: 1; padding: 0; color: var(--ink); }
.daynav button:disabled { opacity: .35; }
.qadd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qadd button { display: grid; justify-items: center; gap: 2px; padding: 10px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); font-size: .82rem; font-weight: 700; color: var(--ink); }
.qadd button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.qadd .e { font-size: 1.4rem; line-height: 1.2; }
.seg { grid-column: 1 / -1; display: flex; gap: 6px; }
.seg button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 10px; padding: 7px 0; font-size: .82rem; color: var(--ink); }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.chat { display: grid; gap: 8px; }
.chat .msgs { display: grid; gap: 8px; }
.chat .qm { justify-self: end; max-width: 85%; background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: .9rem; white-space: pre-wrap; }
.chat .am { justify-self: start; max-width: 92%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 12px; font-size: .9rem; display: grid; gap: 6px; }
.chat .am p { margin: 0; white-space: pre-wrap; line-height: 1.55; }
.chat .am ul { margin: 0; padding-left: 1.1em; font-size: .78rem; }
.chat form { display: flex; gap: 6px; }
.chat textarea { flex: 1; min-width: 0; resize: none; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: inherit; font-size: .9rem; color: var(--ink); }
.metric { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.metric .k { font-size: .72rem; color: var(--muted); }
.metric .v { font-family: var(--f-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.metric .p { font-size: .72rem; color: var(--accent); font-weight: 700; }
.mtabs { display: flex; gap: 6px; }
.mtabs button { flex: 1; border: 1px solid var(--line); background: none; border-radius: 10px; padding: 5px 0; font-size: .82rem; }
.mtabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 300px; }
.chart .band { fill: var(--accent); }
.chart .mid { stroke: var(--accent); }
.chart .edge { stroke: var(--line); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 4; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .pt { fill: var(--yolk); stroke: var(--ink); stroke-width: 1.5; }
.chart .ln { stroke: var(--ink); fill: none; stroke-width: 1.5; }
.chart .today { stroke: var(--yolk); stroke-width: 1.5; }
.addrec summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .9rem; }
.recform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.recform label { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); min-width: 0; }
.recform input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.recform .btn { grid-column: 1 / -1; }
.recs { display: grid; gap: 4px; }
.rec { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .82rem; padding: 6px 2px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.rec .d { color: var(--muted); }
.rec button { border: 0; background: none; color: var(--muted); font-size: .8rem; }
.ms { display: grid; gap: 10px; }
.ms h4 { margin: 0; font-size: .76rem; color: var(--muted); letter-spacing: .04em; }
.ms .grp { display: grid; gap: 4px; }
.period { display: grid; gap: 6px; font-size: .92rem; }
.period ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; display: grid; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: grid; gap: 2px; }
.brand h1 { font-family: var(--f-display); font-size: 1.75rem; line-height: 1.2; margin: 0; font-weight: 400; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }
.dday { display: flex; align-items: baseline; gap: 6px; background: var(--yolk-soft); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.dday b { font-family: var(--f-display); font-size: 1.05rem; font-weight: 400; line-height: 1.2; font-variant-numeric: tabular-nums; }
.dday span { font-size: .72rem; color: var(--muted); }

/* Search */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

/* Category rail */
.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cat { display: grid; align-content: center; gap: 2px; height: 58px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); position: relative; min-width: 0; }
.cat .nm { font-weight: 700; font-size: .85rem; display: flex; align-items: center; gap: 6px; min-width: 0; }
.cat .nm .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .ct { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { border-color: var(--cc, var(--accent)); box-shadow: inset 0 0 0 1px var(--cc, var(--accent)); background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cc, var(--accent)); flex: none; }
.subs { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; font-size: .82rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Section header */
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; margin: 0; }
.sec-h small { color: var(--muted); }
.toggle { border: 0; background: none; color: var(--accent); font-size: .85rem; padding: 4px; }

/* Tip cards */
.list { display: grid; gap: 8px; }
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 6px; text-align: left; border: 0; width: 100%; }
.card .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
.card .meta .cl { color: var(--cc); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.card { grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 12px; }
.card-main { display: grid; gap: 6px; min-width: 0; }
.card-thumb { width: 56px; height: 80px; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.detail-thumb { width: 100%; max-width: 300px; aspect-ratio: 1; object-fit: cover; border-radius: 16px; justify-self: center; background: var(--surface-2); }
.drop { display: grid; gap: 8px; }
.drop-btn { display: grid; gap: 4px; text-align: left; padding: 18px 18px; border-radius: 16px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop-btn b { font-size: 1.05rem; color: var(--accent); }
.drop-btn span { font-size: .85rem; color: var(--muted); }
.drop-btn:disabled { opacity: .6; cursor: progress; }
.howto summary { cursor: pointer; font-size: .85rem; color: var(--accent); }
.howto ol { margin: 6px 0 0; padding-left: 1.2em; font-size: .85rem; color: var(--muted); display: grid; gap: 4px; }
.hint.err { color: var(--danger); }
.hint.ok { color: var(--accent); }
.drop-btn.nudge { animation: nudge .6s ease-in-out 2; }
@keyframes nudge { 50% { box-shadow: 0 0 0 4px var(--yolk); } }
.thumbs figcaption { position: absolute; left: 0; right: 0; bottom: 0; font-size: .62rem; text-align: center; background: rgba(0,0,0,.55); color: #fff; font-variant-numeric: tabular-nums; }
.card h3 { margin: 0; font-size: 1.02rem; line-height: 1.45; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { font-size: .7rem; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.badge.ex { background: var(--yolk-soft); border-color: transparent; color: var(--ink); }
.badge.when { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.badge.auto { background: color-mix(in srgb, var(--c-docs) 18%, var(--surface)); border-color: transparent; color: var(--ink); }
.srcs { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.srcs a { color: var(--accent); word-break: break-all; }
.srcs small { color: var(--muted); }
.prog { font-variant-numeric: tabular-nums; }
.ask { display: grid; gap: 12px; }
.ask-form { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; display: grid; gap: 6px; border: 1.5px solid var(--accent-soft); }
.ask-row { display: flex; gap: 8px; align-items: flex-end; }
.ask-row .btn { padding: 10px 16px; }
.ask-label { font-family: var(--f-display); font-size: 1.2rem; }
.ask-form textarea { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 10px; background: var(--surface-2); resize: none; min-height: 42px; max-height: 140px; field-sizing: content; }
.ask-foot { display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.ask-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 2px 2px; }
.ask-chips::-webkit-scrollbar { display: none; }
.ask-chips button { flex: none; border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: .76rem; color: var(--muted); }
.ask-out { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; border-left: 4px solid var(--accent); }
.ask-out .q { font-size: .8rem; color: var(--muted); }
.ask-out .reply { white-space: pre-line; }
.ask-out .added { display: grid; gap: 6px; }
.ask-out .added button { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 12px; }
.ask-out .added .cl { color: var(--cc); font-size: .75rem; font-weight: 700; white-space: nowrap; }
.ask-out .added .tt { min-width: 0; font-weight: 500; }
.ask-out .newcat { font-size: .82rem; background: var(--yolk-soft); border-radius: 10px; padding: 6px 10px; }
.ask-out .working { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .9s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } }
.badge.asked { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

(() => {

const BASE_CATS = [

  ["play", /놀이|발달|장난감|책|외출|여행|이동|교육/], ["docs", /서류|신고|지원|바우처|수당|보험|통장|대여|혜택|제도|정부|신청/],

// ---------- D-day ----------
function renderDday() {
  const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());

// ---------- Life stages ----------
const STAGES = [
  { id: "prenatal", name: "출산 전", min: -99, max: 0 },
  { id: "newborn", name: "0~1개월", min: 0, max: 1 },

function stagesOf(t) {

  const out = new Set();
  if (/출산\s*전|임신|출산\s*준비|출산가방|예정일|산전|태교/.test(tx)) out.add("prenatal");
  if (/신생아|출생\s*후|출생신고|배꼽|첫\s*(주|달|목욕)|조리원|생후\s*\d+\s*일/.test(tx)) out.add("newborn");
  const mark = (a, b) => STAGES.forEach(x => { if (x.min < b && x.max > a && x.id !== "prenatal") out.add(x.id); });
  for (const m of tx.matchAll(/(\d+)\s*[~\-–]\s*(\d+)\s*개월/g)) mark(+m[1], +m[2] + 0.01);
  for (const m of tx.matchAll(/(\d+)\s*개월/g)) { const n = +m[1]; if (/이내/.test(tx) && n <= 2) mark(0, n); else mark(n, n + 0.01); }
  if (/100일/.test(tx)) out.add("m1_3"); if (/이유식/.test(tx)) out.add("m3_6"), out.add("m6_12");
  if (/돌\s*(이후|잔치|부터)|(\d)\s*세|어린이집|걸음마/.test(tx)) out.add("y1");
  if (!out.size) (CAT_STAGES[t.category] || ["newborn"]).forEach(x => out.add(x));
  return [...out];
}

function waitFor(v, ev, ms) {
  return new Promise((res, rej) => {
    const done = ok => { clearTimeout(t); v.removeEventListener(ev, onOk); v.removeEventListener("error", onErr); ok ? res() : rej(new Error(ev)); };
    const onOk = () => done(true), onErr = () => done(false);
    const t = setTimeout(() => done(false), ms);
    v.addEventListener(ev, onOk); v.addEventListener("error", onErr);
  });
}
function ytUrl(u) {
  const m = (u || "").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i);
  return m ? `https://www.youtube.com/watch?v=${m[1]}` : null;
}
const isInsta = u => /instagram\.com|instagr\.am/i.test(u || "");

}

function fmtSec(t) { const s = Math.round(t); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

// One preview frame for the card; the video itself goes to Gemini whole.
async function videoPreview(file) {
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = url;
  try {
    await waitFor(v, "loadeddata", 15000);
    try { await v.play(); v.pause(); } catch {}
    const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
    if (dur) { v.currentTime = dur / 3; await waitFor(v, "seeked", 8000); }
    const s = 160 / Math.max(v.videoWidth, v.videoHeight);
    const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return { thumb: c.toDataURL("image/jpeg", .6), seconds: Math.round(dur) };
  } finally { v.removeAttribute("src"); try { v.load(); } catch {} URL.revokeObjectURL(url); }
}

async function addVideo(file) {
  const st = $("#vidStatus");
  const say = (m, err) => { if (!st) return; st.hidden = !m; st.textContent = m || ""; st.classList.toggle("err", !!err); };
  if (file.size > MAX_VIDEO_BYTES) { say(`영상이 너무 커요 (${Math.round(file.size / 1048576)}MB). 1분 안쪽으로 잘라서 올려 주세요.`, true); return; }
  videoFile = file; videoThumb = ""; videoInfo = null; addImages([]); linkHint();
  say("영상 준비 중이에요…");
  try { const p = await videoPreview(file); videoThumb = p.thumb; videoInfo = { seconds: p.seconds }; } catch {}
  if (videoFile !== file) return;
  say(`영상 준비됐어요${videoInfo?.seconds ? ` (${videoInfo.seconds}초` : " ("}${videoInfo?.seconds ? ", " : ""}${(file.size / 1048576).toFixed(1)}MB). 'AI로 정리하기'를 눌러 주세요.`);
  addImages([]);
}

function buildPrompt(url, text, media) {
  const catText = CATS.map(c => `- ${c.id} (${c.name}): ${subsOf(c.id).join(", ") || "(세부 카테고리 없음)"}`).join("\n");
  return `너는 초보 부모를 돕는 한국어 육아 정리 도우미야. 아기는 2026년 12월 15일 출생 예정이고, 부모는 한국에 살아.
아래는 부모가 유튜브·인스타그램·블로그 등에서 보고 "꿀팁"이라고 생각해서 저장한 자료야. 이 자료를 분석해서 나중에 빠르게 다시 볼 수 있게 정리해 줘.

규칙:
- 자료에 있는 내용만 정리해. 없는 사실을 지어내지 마. 자료가 짧으면 짧게 정리해.
- 자료에 의학적으로 위험하거나 공식 권고와 다른 내용이 있으면 cautions에 부드럽게 적어 줘.
- 금액·기한·자격처럼 바뀔 수 있는 정보는 cautions에 "신청 전 정부24·복지로에서 최신 기준 확인" 같은 안내를 넣어.
- 아래 카테고리 중 가장 잘 맞는 하나를 골라 category에 id를 넣어. 새 큰 카테고리는 만들지 마.
- subcategory는 고른 카테고리의 목록에서 고르고, 맞는 게 없으면 새 세부 카테고리 이름(2~8자)을 만들어.
- 쉬운 말, 짧은 문장, 존댓말이 아닌 "~하기", "~해요" 같은 부드러운 말투.

카테고리:
${catText}

JSON 하나만 출력해. 다른 글은 쓰지 마. 형식:
{
  "title": "한눈에 알아볼 제목 (25자 이내)",
  "category": "카테고리 id",
  "subcategory": "세부 카테고리 (기존 것 또는 새로 만든 것)",

const QUOTA_HELP = "새 API 키를 만들어도 같은 구글 프로젝트 안이면 한도를 같이 써서 늘지 않아요. 한도를 늘리려면 Google AI Studio의 API 키 화면에서 그 프로젝트에 결제(Billing)를 연결해야 해요. 결제를 연결하면 쓴 만큼 요금이 나와요.";
function errText(e, fallback) {
  if (e?.code === "quota_day") return `오늘 쓸 수 있는 제미나이 무료 횟수를 다 썼어요. ${resetText()}에 다시 채워져요.`;
  if (e?.code === "quota_zero") return "지금 키의 무료 등급에서는 이 기능을 쓸 수 없다고 해요. 구글 검색으로 찾기는 무료 등급에서 막혀 있을 수 있어요.";
  return ERR[e?.code] || fallback;
}
function errBox(e, fallback) {
  const quota = /^quota_/.test(e?.code || "");
  return el("div", { class: "status err" },
    el("div", { text: errText(e, fallback) }),
    quota ? el("p", { class: "note", style: "margin:6px 0 0" }, QUOTA_HELP + " ", el("a", { href: "https://aistudio.google.com/apikey", target: "_blank", rel: "noopener noreferrer", text: "AI Studio 열기" })) : null,
    e?.message ? el("details", { style: "margin-top:6px;font-size:.75rem" }, el("summary", { text: "구글이 보낸 원래 메시지" }), el("div", { text: String(e.message).slice(0, 400) })) : null);
}

function setStatus(msg, err) { const s = $("#aiStatus"); if (!s) return; s.hidden = !msg; s.textContent = msg || ""; s.classList.toggle("err", !!err); }

const ERR = {
  no_key: "제미나이 API 키가 없어요. 설정에서 키를 넣어 주세요.",

  upload: "영상을 제미나이에 올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.",
  processing: "제미나이가 영상을 읽는 데 너무 오래 걸려요. 조금 짧은 영상으로 다시 시도해 주세요.",
  blocked: "제미나이가 이 자료는 정리할 수 없다고 했어요. 캡션이나 캡처로 다시 시도해 주세요.",
  bad_json: "제미나이 답을 읽지 못했어요. 한 번 더 눌러 주세요.",

async function runAI() {
  const url = str($("#urlIn").value, 500), text = str($("#txtIn").value, 20000);
  if (!getKey()) { setStatus(ERR.no_key, true); return; }
  const yt = !videoFile ? ytUrl(url) : null;
  if (!text && !images.length && !videoFile && !yt) {
    if (isInsta(url)) { setStatus("인스타 링크만으로는 분석할 수 없어요. 인스타가 다른 앱이 영상을 가져가지 못하게 막아 두었거든요. 릴스 공유 버튼의 '다운로드'로 영상을 저장한 뒤 위의 '릴스 영상 올리기'로 넣어 주세요. 캡션을 복사해 붙여넣어도 돼요.", true); nudgeVideo(); }
    else setStatus("릴스 영상이나 캡처를 올리거나, 캡션을 넣어 주세요. 유튜브가 아닌 링크만으로는 AI가 영상을 볼 수 없어요.", true);
    return;
  }
  const btn = $("#aiBtn"); btn.disabled = true; btn.textContent = "정리하는 중…";
  setStatus(videoFile ? "영상을 올리는 중이에요…" : "제미나이가 읽고 분류하는 중이에요.");
  try {
    let media = "";
    if (videoFile || yt) media += "첨부한 영상은 부모가 저장한 짧은 육아 영상(인스타 릴스 등)이야. 처음부터 끝까지 소리(말, 설명)와 화면(자막, 큰 글씨, 손동작, 순서)을 모두 보고 들어서 무엇을 어떻게 하는 팁인지 정리해. 배경음악, 인스타 아이디, 좋아요 수 같은 건 무시해.\n";
    if (images.length) media += `첨부한 이미지 ${images.length}장은 부모가 직접 올린 캡처(카드뉴스, 게시글 화면 등)야. 글자를 읽어서 정리해.\n`;
    const r = await gemini(buildPrompt(url, text, media), { video: videoFile, youtube: yt, images: images.map(i => i.file), onStage: m => setStatus(m) });
    if (!r || typeof r !== "object") throw { code: "bad_json" };
    const rc = OLD_CAT[r.category] || r.category;
    let cat = catById[rc] ? rc : (catByName[rc]?.id || null), newCat = "";
    if (!cat) {
      cat = guessCat([r.category, r.subcategory, r.title].join(" ")) || "gear";
    }
    const sub = str(r.subcategory, 30) || (cat ? subsOf(cat)[0] : "") || "기타";
    const spoken = str(r.spoken, 3000);
    reviewDraft({
      title: str(r.title, 80) || "새 꿀팁", category: cat || "__new", newCategory: newCat, subcategory: sub,
      summary: str(r.summary, 600), points: arr(r.points).slice(0, 12), steps: arr(r.steps).slice(0, 15),
      cautions: arr(r.cautions).slice(0, 8), when: str(r.when, 40), tags: arr(r.tags).slice(0, 8),
      checklist: arr(r.checklist).slice(0, 15), url, ai: true, thumb: videoThumb,
      original: [text, spoken && "[영상 속 내용]\n" + spoken].filter(Boolean).join("\n\n").slice(0, 8000),
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = "AI로 정리하기";
    const msg = errText(e, "정리하다가 문제가 생겼어요." + (e?.message ? ` (${String(e.message).slice(0, 160)})` : "") + " 다시 눌러 보거나 직접 정리하기를 써 주세요.");
    setStatus(/^quota_/.test(e?.code || "") ? `${msg} ${QUOTA_HELP}` : msg, true);
  }
}

// Review / edit before saving
function reviewDraft(d) {
  draft = d;
  const catSel = el("select", { id: "rvCat" },
    CATS.map(c => el("option", { value: c.id, selected: c.id === d.category, text: c.name })),
    el("option", { value: "__new", selected: d.category === "__new", text: "+ 새 카테고리 만들기" }));
  const newIn = el("input", { id: "rvNew", value: d.newCategory || "", placeholder: "예: 이동·외출" });
  const newField = el("div", { class: "field", hidden: d.category !== "__new" },
    el("label", { for: "rvNew", text: "새 카테고리 이름" }), newIn);
  const subIn = el("input", { id: "rvSub", list: "subList", value: d.subcategory || "" });
  const subList = el("datalist", { id: "subList" });
  const fillSubs = () => { subList.replaceChildren(...subsOf(catSel.value).map(s => el("option", { value: s }))); };
  catSel.addEventListener("change", () => {
    fillSubs(); newField.hidden = catSel.value !== "__new";
    if (catSel.value === "__new") newIn.focus(); else subIn.value = subsOf(catSel.value)[0] || "";
  });
  fillSubs();
  const subIsNew = d.category !== "__new" && d.subcategory && !subsOf(d.category).includes(d.subcategory);
  const aiNote = !d.ai ? null
    : d.category === "__new" ? `맞는 카테고리가 없어서 '${d.newCategory}' 카테고리를 새로 만들어 정리했어요. 저장하면 카테고리 목록에 추가돼요.`
    : subIsNew ? `'${d.subcategory}' 세부 카테고리를 새로 만들어 정리했어요. 고칠 곳이 있으면 고친 뒤 저장해 주세요.`
    : "AI가 이렇게 정리했어요. 고칠 곳이 있으면 고친 뒤 저장해 주세요.";
  const lines = a => (a || []).join("\n");
  const ta = (id, v, ph) => el("textarea", { id, placeholder: ph, style: "min-height:90px" }, v);

  const body = el("div", { style: "display:grid;gap:14px" },
    aiNote ? el("div", { class: "status", text: aiNote }) : null,
    el("div", { class: "field" }, el("label", { for: "rvTitle", text: "제목" }), el("input", { id: "rvTitle", value: d.title })),
    el("div", { class: "row" },
      el("div", { class: "field" }, el("label", { for: "rvCat", text: "카테고리" }), catSel),
      el("div", { class: "field" }, el("label", { for: "rvSub", text: "세부 카테고리" }), subIn, subList)),
    newField,
    el("div", { class: "field" }, el("label", { for: "rvWhen", text: "언제 쓰는 팁" }), el("input", { id: "rvWhen", value: d.when || "", placeholder: "예: 출생 후 1개월 이내" })),
    el("div", { class: "field" }, el("label", { for: "rvSum", text: "한눈에 요약" }), ta("rvSum", d.summary, "핵심 한두 문장")),
    el("div", { class: "field" }, el("label", { for: "rvPts", text: "핵심 포인트 (한 줄에 하나)" }), ta("rvPts", lines(d.points))),
    el("div", { class: "field" }, el("label", { for: "rvSteps", text: "방법 순서 (한 줄에 하나)" }), ta("rvSteps", lines(d.steps))),
    el("div", { class: "field" }, el("label", { for: "rvCau", text: "주의할 점 (한 줄에 하나)" }), ta("rvCau", lines(d.cautions))),
    el("div", { class: "field" }, el("label", { for: "rvChk", text: "할 일 체크리스트 (한 줄에 하나)" }), ta("rvChk", lines(d.checklist))),
    el("div", { class: "field" }, el("label", { for: "rvTags", text: "태그 (쉼표로 구분)" }), el("input", { id: "rvTags", value: (d.tags || []).join(", ") })),
    el("div", { class: "status", id: "aiStatus", hidden: true }),
    el("div", { class: "actions" }, el("button", { class: "btn", id: "saveBtn", onclick: saveDraft, text: "저장하기" })));

async function saveDraft() {
  if (!tipsCol) { setStatus("저장 공간에 연결되지 않았어요. 로그인한 상태에서 다시 열어 주세요.", true); return; }
  const v = id => $(id).value;
  const lines = id => v(id).split("\n").map(s => s.trim()).filter(Boolean);
  const url = draft?.url || "";
  let category = v("#rvCat");
  const subcategory = str(v("#rvSub"), 30) || "기타";
  let newCatName = "";
  if (category === "__new") {
    newCatName = str(v("#rvNew"), 20);
    if (!newCatName) { setStatus("새 카테고리 이름을 적어 주세요.", true); return; }
    if (catByName[newCatName]) { category = catByName[newCatName].id; newCatName = ""; }
  }
  const data = {
    title: str(v("#rvTitle"), 80) || "새 꿀팁", category, subcategory,
    when: str(v("#rvWhen"), 40), summary: str(v("#rvSum"), 600), points: lines("#rvPts"), steps: lines("#rvSteps"),
    cautions: lines("#rvCau"), checklist: lines("#rvChk").map(text => ({ text, done: false })),
    tags: v("#rvTags").split(",").map(s => s.trim()).filter(Boolean).slice(0, 8),
    url, source: sourceOf(url), original: str(draft?.original, 8000), starred: false, createdAt: Date.now(), ai: !!draft?.ai,
  };
  if (/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(draft?.thumb || "") && draft.thumb.length < 60000) data.thumb = draft.thumb;
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "저장 중…";
  try {
    if (newCatName) {
      const id = "c-" + Date.now().toString(36);
      await catsCol.doc(id).set({ name: newCatName, subs: [subcategory], color: PALETTE[CATS.length % PALETTE.length], createdAt: Date.now() });
      data.category = id;
    }
    await tipsCol.add(data);
    closeSheet(); selCat = data.category; selSub = null; query = ""; $("#q").value = ""; render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "저장하기";
    setStatus(e?.code === "permission_denied" ? "이 계정은 저장 권한이 없어요." : "저장하지 못했어요. 다시 눌러 주세요.", true);
  }
}

// ---------- Detail ----------
function openDetail(id) {
  const t = tips.find(x => x.id === id); if (!t) return;
  const ref = tipsCol.doc(id);
  const c = catById[t.category] || CATS[0];
  const list = (title, items, ordered, cls) => items && items.length
    ? el("div", { class: "blk" + (cls ? " " + cls : "") }, el("h4", { text: title }), el(ordered ? "ol" : "ul", {}, items.map(s => el("li", { text: s })))) : null;

  const checks = el("div", { class: "checks" });
  const drawChecks = cl => {
    checks.replaceChildren(...cl.map((it, i) => {
      const cb = el("input", { type: "checkbox", id: `ck-${id}-${i}`, checked: !!it.done });
      cb.addEventListener("change", async () => {
        const next = cl.map((x, j) => j === i ? { ...x, done: cb.checked } : x);
        cl = next; drawChecks(cl);
        try { await ref.update({ checklist: next }); } catch { cb.checked = !cb.checked; }
      });
      return el("label", { class: "check" + (it.done ? " done" : ""), for: `ck-${id}-${i}` }, cb, el("span", { text: it.text }));
    }));
  };
  drawChecks(t.checklist || []);

  const catSel = el("select", { id: "dCat", "aria-label": "카테고리 옮기기" }, CATS.map(x => el("option", { value: x.id, selected: x.id === t.category, text: x.name })));
  catSel.addEventListener("change", async () => {
    const nc = catById[catSel.value];
    try { await ref.update({ category: nc.id, subcategory: subsOf(nc.id).includes(t.subcategory) ? t.subcategory : (subsOf(nc.id)[0] || "기타") }); } catch {}
  });

  const confirmBox = el("div", { class: "confirm", hidden: true },
    el("span", { text: t.auto ? "이 꿀팁을 목록에서 뺄까요? 다시 들어오지 않아요." : "이 꿀팁을 지울까요? 되돌릴 수 없어요." }),
    el("div", { class: "actions" },
      el("button", { class: "btn ghost", text: "취소", onclick: () => { confirmBox.hidden = true; } }),
      el("button", { class: "btn danger", text: "지우기", onclick: async () => { try { await (t.auto ? ref.update({ hidden: true }) : ref.delete()); closeSheet(); } catch {} } })));

  const href = safeUrl(t.url);
  const body = el("div", { class: "detail", style: `--cc: var(${c.c})` },
    el("div", { class: "card", style: "box-shadow:none;padding:0;background:none" },
      el("div", { class: "meta" }, el("span", { class: "cl" }, el("span", { class: "dot" }), `${c.name} · ${t.subcategory || "기타"}`),
        t.when ? el("span", { class: "badge when", text: t.when }) : null, t.example ? el("span", { class: "badge ex", text: "예시" }) : null,
        t.auto ? el("span", { class: "badge auto", text: "자동 수집" }) : null)),
    el("h3", { text: t.title }),
    t.summary ? el("div", { class: "summary", text: t.summary }) : null,
    list("핵심 포인트", t.points),
    list("이렇게 해요", t.steps, true),
    (t.checklist || []).length ? el("div", { class: "blk" }, el("h4", { text: "할 일" }), checks) : null,
    list("주의할 점", t.cautions, false, "warn"),
    (t.tags || []).length ? el("div", { class: "tags" }, t.tags.map(s => el("span", { text: "#" + s }))) : null,
    (t.sources || []).length ? el("div", { class: "blk src" }, el("h4", { text: "출처" }),
      el("ul", { class: "srcs" }, t.sources.map(x => el("li", {},
        safeUrl(x.url) ? el("a", { href: safeUrl(x.url), target: "_blank", rel: "noopener noreferrer", text: x.name }) : el("span", { text: x.name }),
        x.date ? el("small", { text: ` · ${x.date}` }) : null))),
      el("p", { class: "note", text: t.auto
        ? `${t.checkedAt ? t.checkedAt + "에 " : ""}Claude가 공식 자료를 보고 모았어요. 금액·기한은 바뀔 수 있으니 신청 전 출처에서 한 번 더 확인해 주세요.`
        : `${t.checkedAt ? t.checkedAt + "에 " : ""}제미나이가 구글 검색으로 찾은 출처예요.${t.question ? ` (질문: ${t.question})` : ""} 금액·기한은 바뀔 수 있으니 신청 전 출처에서 한 번 더 확인해 주세요.` })) : null,
    !t.auto && !(t.sources || []).length && href ? el("div", { class: "blk src" }, el("h4", { text: "원본" }), el("a", { href, target: "_blank", rel: "noopener noreferrer", text: `${t.source || sourceOf(href)}에서 다시 보기` })) : null,
    t.original ? el("details", { class: "orig" }, el("summary", { text: "넣었던 원래 내용 보기" }), el("pre", { text: t.original })) : null,
    el("div", { class: "row" },
      el("div", { class: "field" }, el("label", { for: "dCat", text: "카테고리 옮기기" }), catSel)),
    el("div", { class: "actions" },
      el("button", { class: "btn ghost", text: t.starred ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기", onclick: async e => {
        try { await ref.update({ starred: !t.starred }); t.starred = !t.starred; e.target.textContent = t.starred ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기"; } catch {} } }),
      el("button", { class: "btn danger", text: "지우기", onclick: () => { confirmBox.hidden = false; } })),
    confirmBox,
    tipChat(t, ref));
  openSheet("꿀팁", body);
}

// ---------- Tip chat: follow-up questions about one tip (saved on the tip, so both parents see it) ----------
function tipChatPrompt(t, q, noSearch) {
  const tip = { 제목: t.title, 카테고리: (catById[t.category] || {}).name, 요약: t.summary, 핵심: t.points, 방법: t.steps, 주의: t.cautions, 시기: t.when,
    출처: (t.sources || []).map(x => `${x.name} ${x.url || ""}`.trim()) };

// ---------- Local storage (IndexedDB) with the same shape the page uses ----------
const LocalDB = (() => {
  const ST = "docs";
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open("yeongwoong-notes", 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => { const d = await dbp; return new Promise((res, rej) => {
    const t = d.transaction(ST, mode); const req = fn(t.objectStore(ST));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  const subs = {};
  async function all(col) {
    const d = await dbp;
    return new Promise((res, rej) => {
      const out = [], r = d.transaction(ST).objectStore(ST).openCursor(IDBKeyRange.bound(col + "/", col + "/￿"));
      r.onsuccess = () => { const c = r.result; if (c) { out.push({ id: c.key.slice(col.length + 1), data: c.value }); c.continue(); } else res(out); };
      r.onerror = () => rej(r.error);
    });
  }
  async function fire(col) {
    const rows = await all(col);
    const docs = rows.map(r => ({ id: r.id, data: () => r.data }));
    (subs[col] || []).forEach(s => s.fn({ docs: s.sort(docs) }));
  }
  try { navigator.storage?.persist?.(); } catch {}
  function collection(col) {
    let ob = null, dir = "asc";
    const q = {
      orderBy(f, d = "asc") { ob = f; dir = d; return q; },
      limit() { return q; },
      onSnapshot(fn, err) {
        const sort = docs => !ob ? docs : docs.slice().sort((a, b) => { const x = a.data()[ob] ?? 0, y = b.data()[ob] ?? 0; return (x > y ? 1 : x < y ? -1 : 0) * (dir === "desc" ? -1 : 1); });
        (subs[col] ||= []).push({ fn, sort }); fire(col).catch(e => err && err(e)); return () => {};
      },
      doc(id) { const key = col + "/" + id; return {
        set: async d => { await run("readwrite", s => s.put(d, key)); await fire(col); },
        update: async p => { const cur = await run("readonly", s => s.get(key)); await run("readwrite", s => s.put({ ...(cur || {}), ...p }, key)); await fire(col); },
        delete: async () => { await run("readwrite", s => s.delete(key)); await fire(col); },
      }; },
      add: async d => { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await q.doc(id).set(d); return { id }; },
    };
    return q;
  }
  return { collection, all };
})();

const GBASE = "https://generativelanguage.googleapis.com";
const LS = { key: "yw.geminiKey", model: "yw.geminiModel", seeded: "yw.seeded", family: "yw.family", autoOff: "yw.autoOff" };
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
let familyKey = "";
function getKey() { return lsGet(LS.key) || familyKey; }

async function gfetch(path, opts = {}) {
  let r;
  try { r = await fetch(path.startsWith("http") ? path : GBASE + path, { ...opts, headers: { "x-goog-api-key": getKey(), ...(opts.headers || {}) } }); }
  catch { throw { code: navigator.onLine === false ? "offline" : "upload" }; }
  if (!r.ok) {
    let m = "", det = []; try { const er = (await r.json()).error || {}; m = er.message || ""; det = er.details || []; } catch {}
    const ids = det.flatMap(d => (d.violations || []).map(v => `${v.quotaId || ""} ${v.quotaMetric || ""}`)).join(" ");
    if (r.status === 429 || /free.?tier|FREE_TIER/i.test(m) && r.status === 403) {
      // limit 0 = this model or feature has no free allowance; PerDay = today's allowance is used up; else per-minute.
      const code = /limit:\s*0\b/.test(m) || r.status === 403 ? "quota_zero" : /PerDay|per day|daily/i.test(`${m} ${ids}`) ? "quota_day" : "rate_limited";
      throw { code, message: m };
    }
    if (r.status === 400 && /api key/i.test(m) || r.status === 401 || r.status === 403) throw { code: "bad_key", message: m };
    throw { code: "api", message: m || `HTTP ${r.status}` };
  }
  return r;
}

// Text models to try, best first. Each Gemini model has its own free allowance, so when one is used up we move to the next.
let modelList = null;
async function listModels() {
  if (modelList) return modelList;
  const j = await (await gfetch("/v1beta/models?pageSize=200")).json();
  modelList = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
  return modelList;
}
function modelChain(ok) {
  const ver = re => n => { const m = n.match(re); return m ? parseFloat(m[1]) : -1; };
  const vf = ver(/^gemini-(\d+(?:\.\d+)?)-flash$/), vl = ver(/^gemini-(\d+(?:\.\d+)?)-flash-lite$/);
  const flash = ok.filter(n => vf(n) > 0).sort((a, b) => vf(b) - vf(a)), lite = ok.filter(n => vl(n) > 0).sort((a, b) => vl(b) - vl(a));
  const extra = ["gemini-flash-latest", "gemini-flash-lite-latest"].filter(n => ok.includes(n));
  const out = [...flash.slice(0, 3), ...lite.slice(0, 2), ...extra];
  return out.length ? out : ["gemini-2.5-flash", "gemini-2.5-flash-lite"];
}
// Free daily allowances reset at midnight Pacific time.
const ptDate = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(d);
function resetText() {
  const now = new Date(), d0 = ptDate(now); let t = now;
  for (let i = 0; i < 120 && ptDate(t) === d0; i++) t = new Date(t.getTime() + 15 * 60000);
  t.setMinutes(0, 0, 0);
  const day = t.toDateString() === now.toDateString() ? "오늘" : "내일", h = t.getHours();
  return `${day} ${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시`;
}
function usedUp() { try { const o = JSON.parse(lsGet("yw.usedUp") || "{}"); const d = ptDate(); return Object.fromEntries(Object.entries(o).filter(([, v]) => v === d)); } catch { return {}; } }
function markUsedUp(m) { const o = usedUp(); o[m] = ptDate(); lsSet("yw.usedUp", JSON.stringify(o)); }

// Call generateContent, falling back through the model chain when a model's free allowance is gone.
async function generate(body, onTry) {
  const skip = usedUp();
  let chain = modelChain(await listModels());
  const saved = lsGet(LS.model); if (chain.includes(saved)) chain = [saved, ...chain.filter(n => n !== saved)];
  const key = m => m + (body.tools ? "+search" : "");
  const open = chain.filter(n => !skip[key(n)]);
  if (!open.length) throw { code: "quota_day" };
  let worst = null;
  const rank = { rate_limited: 1, quota_day: 2, quota_zero: 3 };
  for (const m of open) {
    try {
      onTry?.(m);
      const j = await (await gfetch(`/v1beta/models/${m}:generateContent`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
      lsSet(LS.model, m); return j;
    } catch (e) {
      if (!rank[e?.code] && !(e?.code === "api" && /not found|not supported|unavailable|is not available/i.test(e.message || ""))) throw e;
      if (e.code === "quota_day" || e.code === "quota_zero") markUsedUp(key(m));
      if (!worst || (rank[e.code] || 0) < (rank[worst.code] || 9)) worst = e;   // report the most hopeful reason
    }
  }
  throw worst || { code: "quota_day" };
}

const b64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });

async function uploadVideo(file, onStage) {
  const mime = videoMime(file);
  onStage?.(`영상을 올리는 중이에요 (${(file.size / 1048576).toFixed(1)}MB)…`);
  const start = await gfetch("/upload/v1beta/files", { method: "POST", headers: {
    "X-Goog-Upload-Protocol": "resumable", "X-Goog-Upload-Command": "start",
    "X-Goog-Upload-Header-Content-Length": String(file.size), "X-Goog-Upload-Header-Content-Type": mime, "Content-Type": "application/json" },
    body: JSON.stringify({ file: { display_name: "reel" } }) });
  const upUrl = start.headers.get("x-goog-upload-url");
  if (!upUrl) throw { code: "upload", message: "no upload url" };
  const up = await gfetch(upUrl, { method: "POST", headers: { "X-Goog-Upload-Offset": "0", "X-Goog-Upload-Command": "upload, finalize" }, body: file });
  let f = (await up.json()).file;
  onStage?.("제미나이가 영상을 읽을 준비를 하는 중이에요…");
  const t0 = Date.now();
  while (f.state === "PROCESSING") {
    if (Date.now() - t0 > 120000) throw { code: "processing" };
    await new Promise(r => setTimeout(r, 2000));
    f = await (await gfetch("/v1beta/" + f.name)).json();
  }
  if (f.state === "FAILED") throw { code: "api", message: "영상 처리 실패" };
  return f;
}

async function gemini(prompt, { video, youtube, images = [], onStage } = {}) {
  const parts = [];
  let uploaded = null;
  try {
    if (video) {
      if (video.size <= 15 * 1048576) { onStage?.("영상을 보내는 중이에요…"); parts.push({ inline_data: { mime_type: videoMime(video), data: await b64(video) } }); }
      else { uploaded = await uploadVideo(video, onStage); parts.push({ file_data: { mime_type: uploaded.mimeType, file_uri: uploaded.uri } }); }

    for (const im of images) parts.push({ inline_data: { mime_type: im.type || "image/jpeg", data: await b64(im) } });
    parts.push({ text: prompt });
    onStage?.(video || youtube ? "제미나이가 영상을 보고 듣는 중이에요. 보통 10~40초 걸려요." : "제미나이가 읽고 분류하는 중이에요.");
    const j = await generate({ contents: [{ role: "user", parts }], generationConfig: { responseMimeType: "application/json", temperature: 0.3 } });
    const cand = j.candidates?.[0];
    if (!cand || j.promptFeedback?.blockReason || cand.finishReason === "SAFETY") throw { code: "blocked" };
    const txt = (cand.content?.parts || []).map(p => p.text || "").join("").trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
    try { return JSON.parse(txt); } catch { const m = txt.match(/\{[\s\S]*\}/); if (m) return JSON.parse(m[0]); throw { code: "bad_json" }; }
  } finally {

  }

// ---------- Auto-collected tips (tips-feed.json, curated by Claude with sources) ----------
function normTip(t) {
  let cat = OLD_CAT[t.category] || t.category;
  if (!BASE_CATS.some(b => b.id === cat)) {
    const custom = catById[cat];
    const g = guessCat([custom?.name, t.subcategory, t.title].join(" "));
    if (g) cat = g;
  }
  const sub = OLD_SUB[t.subcategory] || t.subcategory || "기타";
  return cat === t.category && sub === t.subcategory ? t : { ...t, category: cat, subcategory: sub, _moved: true };
}
function applyVisible() { tips = allTips.filter(t => !t.hidden && !(autoOff && t.auto)).map(normTip); migrateCats(); }
// Save the tidied categories back once, and drop custom categories that were folded into the main ones.
let migrating = false;
async function migrateCats() {
  if (migrating || !tipsCol) return;
  const moved = tips.filter(t => t._moved); const folded = CATS.filter(c => c.custom && guessCat(c.name));
  if (!moved.length && !folded.length) return;
  migrating = true;
  try {
    for (const t of moved) await tipsCol.doc(t.id).update({ category: t.category, subcategory: t.subcategory });
    for (const c of folded) if (!allTips.some(t => t.category === c.id && !moved.some(m => m.id === t.id))) await catsCol.doc(c.id).delete();
  } catch {} finally { migrating = false; }
}
let feedBusy = false;
async function syncFeed() {
  if (autoOff || feedBusy || !tipsCol) return;
  feedBusy = true;
  try {
    const r = await fetch("tips-feed.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const feed = await r.json();
    const known = Object.fromEntries(allTips.map(t => [t.id, t]));
    for (const f of Array.isArray(feed.tips) ? feed.tips : []) {
      if (!f || !/^[a-z0-9-]{3,60}$/.test(f.id || "")) continue;
      const id = "auto-" + f.id, cur = known[id], rev = Number(f.rev) || 1;
      if (cur && (cur.hidden || (Number(cur.rev) || 0) >= rev)) continue;
      const srcs = (Array.isArray(f.sources) ? f.sources : []).map(x => ({ name: str(x?.name, 60), url: safeUrl(x?.url) || "", date: str(x?.date, 20) })).filter(x => x.name).slice(0, 5);
      const cat = BASE_CATS.some(b => b.id === (OLD_CAT[f.category] || f.category)) ? (OLD_CAT[f.category] || f.category) : (guessCat(f.title) || "docs");
      const doneOf = Object.fromEntries((cur?.checklist || []).map(c => [c.text, !!c.done]));
      const data = {
        title: str(f.title, 80), summary: str(f.summary, 600), when: str(f.when, 40),
        points: arr(f.points), steps: arr(f.steps), cautions: arr(f.cautions), tags: arr(f.tags).slice(0, 8),
        checklist: arr(f.checklist).map(text => ({ text, done: !!doneOf[text] })),
        sources: srcs, url: srcs[0]?.url || "", source: srcs[0]?.name || "자동 수집",
        checkedAt: str(f.checkedAt || feed.updatedAt, 20), rev, auto: true, ai: false, original: "",
        stages: arr(f.stages).filter(x => STAGE_IDS.includes(x)),
      };
      if (cur) await tipsCol.doc(id).update(data);   // keep the family's star and category
      else await tipsCol.doc(id).set({ ...data, category: cat, subcategory: str(f.subcategory, 30) || "기타", starred: false,
        createdAt: Date.parse(f.checkedAt || feed.updatedAt) || Date.now() - 864e5 });
    }
  } catch {} finally { feedBusy = false; }
}

  }]

function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, "").toLowerCase(); } catch { return ""; } }
function parseLooseJson(txt) {
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/); const body = m ? m[1] : txt;
  try { return JSON.parse(body); } catch {}
  const a = body.indexOf("{"), b = body.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(body.slice(a, b + 1)); } catch {} }
  throw { code: "bad_json" };
}

async function askGemini(q, noSearch) {
  const j = await generate({ contents: [{ role: "user", parts: [{ text: askPrompt(q, noSearch) }] }], ...(noSearch ? {} : { tools: [{ google_search: {} }] }), generationConfig: { temperature: 0.2 } });
  const cand = j.candidates?.[0];
  if (!cand || j.promptFeedback?.blockReason || cand.finishReason === "SAFETY") throw { code: "blocked" };
  const txt = (cand.content?.parts || []).map(p => p.text || "").join("");
  const out = parseLooseJson(txt);
  // What Google Search actually returned for this answer.
  const chunks = (cand.groundingMetadata?.groundingChunks || []).map(c => c.web).filter(w => w && safeUrl(w.uri));
  const grounded = new Set(chunks.map(w => (w.title || "").replace(/^www\./, "").toLowerCase()).concat(chunks.map(w => hostOf(w.uri))).filter(Boolean));
  const isGrounded = h => [...grounded].some(g => h === g || h.endsWith("." + g) || g.endsWith("." + h));
  const fallback = chunks.slice(0, 3).map(w => ({ name: str(w.title, 60) || "검색 출처", url: w.uri }));
  const list = Array.isArray(out.tips) ? out.tips : [];
  return {
    reply: str(out.reply, 800),
    searched: chunks.map(w => ({ name: str(w.title, 60), url: w.uri })),
    tips: list.slice(0, 6).map(t => {
      let srcs = (Array.isArray(t.sources) ? t.sources : []).map(x => ({ name: str(x?.name, 60), url: safeUrl(x?.url) || "" }))
        .filter(x => x.url && x.name && (!chunks.length || isGrounded(hostOf(x.url))));
      if (!srcs.length) srcs = fallback;
      return { ...t, sources: srcs.slice(0, 5) };
    }),
  };
}

async function runAsk(q, noSearch) {
  q = str(q, 500);
  if (!q || askBusy) return;
  if (!getKey()) { showBanner("오른쪽 위 '설정'에서 제미나이 API 키를 먼저 넣어 주세요."); openSettings(); return; }
  if (!tipsCol) return;
  askBusy = true; $("#askBtn").disabled = true; $("#askBtn").textContent = "찾는 중…";
  renderAskWorking(q);
  try {
    const r = await askGemini(q, noSearch);
    const added = [], newCats = [], made = {};
    const now = Date.now(), today = new Date().toISOString().slice(0, 10);
    if (noSearch) r.tips.forEach(t => { t.sources = []; t.cautions = ["구글 검색 없이 제미나이가 알고 있는 내용으로 정리했어요. 공식 사이트에서 한 번 더 확인해 주세요.", ...arr(t.cautions)]; });
    for (let i = 0; i < r.tips.length; i++) {
      const t = r.tips[i];
      const tc = OLD_CAT[t.category] || t.category;
      let cat = BASE_CATS.some(b => b.id === tc) ? tc : (catByName[tc]?.id || null);
      if (!cat) cat = guessCat([t.category, t.subcategory, t.title].join(" ")) || "gear";
      const id = `ask-${now.toString(36)}-${i}`;
      const data = {
        title: str(t.title, 80) || "새 꿀팁", category: cat, subcategory: str(t.subcategory, 30) || (subsOf(cat)[0] || "기타"),
        summary: str(t.summary, 600), points: arr(t.points).slice(0, 12), steps: arr(t.steps).slice(0, 15), cautions: arr(t.cautions).slice(0, 8),
        when: str(t.when, 40), tags: arr(t.tags).slice(0, 8), checklist: arr(t.checklist).slice(0, 15).map(text => ({ text, done: false })),
        stages: arr(t.stages).filter(x => STAGE_IDS.includes(x)),
        sources: t.sources, url: t.sources[0]?.url || "", source: t.sources[0]?.name || "제미나이 검색",
        origin: "ask", question: q, checkedAt: today, ...(noSearch ? { unverified: true } : {}), ai: true, starred: false, original: "", createdAt: now - i,
      };
      await tipsCol.doc(id).set(data);
      added.push({ id, ...data });
    }
    renderAskResult(q, r, added, newCats, noSearch);
    $("#askIn").value = "";
  } catch (e) {
    const out = $("#askOut"); out.hidden = false;
    out.replaceChildren(...[el("div", { class: "q", text: `"${q}"` }),
      errBox(e, "찾다가 문제가 생겼어요. 잠시 뒤 다시 눌러 주세요."),
      e?.code === "quota_zero" && !noSearch ? el("button", { class: "btn ghost", type: "button", text: "검색 없이 제미나이가 아는 것으로 정리하기", onclick: () => runAsk(q, true) }) : null].filter(Boolean));
  } finally { askBusy = false; $("#askBtn").disabled = false; $("#askBtn").textContent = "찾기"; }
}

function renderAskResult(q, r, added, newCats, noSearch) {
  const out = $("#askOut"); out.hidden = false;
  const undo = el("button", { class: "toggle", style: "justify-self:start", text: "방금 추가한 것 되돌리기", onclick: async () => {
    undo.disabled = true;
    for (const a of added) { try { await tipsCol.doc(a.id).delete(); } catch {} }
    for (const c of newCats) { try { await catsCol.doc(c.id).delete(); } catch {} }
    out.replaceChildren(el("div", { class: "q", text: `"${q}"` }), el("div", { text: "추가했던 꿀팁을 모두 지웠어요." }));
  } });
  out.replaceChildren(...[
    el("div", { class: "q", text: `"${q}"` }),
    el("div", { class: "reply", text: r.reply || (added.length ? "찾은 내용을 정리했어요." : "추가할 만한 새 내용을 찾지 못했어요.") }),
    added.length ? el("div", { class: "added" },

      added.map(a => { const c = catById[a.category]; return el("button", { style: `--cc: ${catColor(a.category)}`, onclick: () => openDetail(a.id) },
        el("span", { class: "cl", text: `${c?.name || "기타"} · ${a.subcategory}` }), el("span", { class: "tt", text: a.title })); })) : null,
    newCats.length ? el("div", { class: "newcat", text: `새 카테고리를 만들었어요: ${newCats.map(c => c.name).join(", ")}` }) : null,
    added.length ? el("p", { class: "note", text: noSearch ? "구글 검색 없이 정리해서 출처가 없어요. 중요한 내용은 공식 사이트에서 한 번 더 확인해 주세요." : "꿀팁을 누르면 출처 링크까지 볼 수 있어요." }) : null,
    added.length ? undo : null].filter(Boolean));
}

      (out[d] ||= {})[id] = { k: e.k, t: e.t, ft: FEED_T[e.ft] ? e.ft : "", ml: Math.max(0, Math.min(400, +e.ml || 0)), min: Math.max(0, Math.min(1440, +e.min || 0)) };

function onFamilyCare(x) { care = readCare(x); pruneCare(); if (location.hash === "#grow") renderGrow(); }
let pruned = false;
function pruneCare() {
  if (pruned || !fam) return; pruned = true;
  const old = dayKey(new Date(Date.now() - 120 * 864e5));
  const upd = {}; for (const d of Object.keys(care)) if (d < old) upd["care." + d] = firebase.firestore.FieldValue.delete();
  if (Object.keys(upd).length) fam.update(upd).catch(() => {});
}
async function careSave(day, id, e) {
  (care[day] ||= {})[id] = e; renderGrow();
  try { if (fam) await fam.update({ [`care.${day}.${id}`]: e }); else lsSet("yw.care", JSON.stringify(care)); }
  catch { showBanner("기록을 저장하지 못했어요. 인터넷 연결을 확인해 주세요."); }
}
async function careDelete(day, id) {

// Typical ranges by age in days (AAP, CDC, AASM).
function careNorms(d) {
  d = Math.max(0, d);
  return {
    feed: d < 30 ? [8, "하루 8~12번 (2~3시간마다)"] : d < 180 ? [0, "보통 3~4시간마다"] : [0, "하루 5~6번쯤 (이유식 포함)"],
    ml: d < 3 ? "분유는 한 번에 30~60ml" : d < 30 ? "분유는 한 번에 30~60ml, 한 달쯤엔 90~120ml" : d < 150 ? "분유는 한 번에 90~120ml 이상" : "분유는 한 번에 180~240ml (6개월쯤, 하루 4~5번)",
    pee: d < 5 ? [2, "하루 2~3번 이상"] : [5, "하루 5~6번 이상"],
    poop: d >= 4 && d < 42 ? [4, "하루 4번 이상 (생후 4일부터)"] : [0, d < 4 ? "처음 며칠은 검은 태변이 나와요" : "아기마다 차이가 커요"],
    sleep: d < 120 ? "하루 16~18시간 (CDC)" : d < 365 ? "하루 12~16시간, 낮잠 포함 (AASM)" : "하루 11~14시간, 낮잠 포함 (AASM)",
  };
}
function careForm(k) {
  const f = $("#careForm"); careOpen = k;
  document.querySelectorAll(".qadd button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  if (!k) { f.hidden = true; f.replaceChildren(); return; }
  const isToday = careDay.getTime() === today0().getTime(), now = isToday ? hm(new Date()) : "12:00";
  const tIn = el("input", { type: "time", id: "cfT", value: now, required: true });
  const kids = [];
  if (k === "feed") {
    const amt = el("input", { type: "number", id: "cfA", min: "0", max: k === "feed" && feedType === "breast" ? "180" : "400", step: feedType === "breast" ? "1" : "5", inputmode: "numeric", placeholder: feedType === "breast" ? "15" : "80" });
    kids.push(el("div", { class: "seg", role: "group", "aria-label": "수유 종류" }, Object.entries(FEED_T).map(([id, nm]) =>
      el("button", { type: "button", "aria-pressed": String(feedType === id), text: nm, onclick: () => { feedType = id; careForm("feed"); } }))),
      el("label", {}, feedType === "breast" ? "몇 분 먹었나요" : "몇 ml 먹었나요", amt), el("label", {}, "시간", tIn));
  } else if (k === "sleep") {
    const st = el("input", { type: "time", id: "cfS", value: isToday ? hm(new Date(Date.now() - 36e5)) : "13:00", required: true });
    tIn.value = isToday ? now : "14:00";
    kids.push(el("label", {}, "잠든 시간", st), el("label", {}, "깬 시간", tIn));
  } else kids.push(el("label", { style: "grid-column: 1 / -1" }, "시간", tIn));
  kids.push(el("button", { class: "btn", type: "submit", text: `${CARE_K[k]} 기록하기` }));
  f.replaceChildren(...kids); f.hidden = false;
  f.onsubmit = e => {
    e.preventDefault();
    const t = $("#cfT").value; if (!/^\d{2}:\d{2}$/.test(t)) return;
    const entry = { k, t, ft: "", ml: 0, min: 0 };
    if (k === "feed") { const a = Math.max(0, +$("#cfA").value || 0); entry.ft = feedType; if (feedType === "breast") entry.min = a; else entry.ml = a; }
    if (k === "sleep") {
      const s0 = $("#cfS").value; if (!/^\d{2}:\d{2}$/.test(s0)) return;
      const toM = x => +x.slice(0, 2) * 60 + +x.slice(3); let dur = toM(t) - toM(s0); if (dur <= 0) dur += 1440;

}
function renderCare(ageDays, born) {
  if (!careDay) careDay = today0();
  const isToday = careDay.getTime() === today0().getTime();
  $("#dayLabel").textContent = `${careDay.getMonth() + 1}월 ${careDay.getDate()}일${isToday ? " (오늘)" : ""}`;
  $("#dayNext").disabled = isToday;
  const list = Object.entries(care[dayKey(careDay)] || {}).map(([id, e]) => ({ id, ...e })).sort((a, b) => b.t.localeCompare(a.t));
  const dAge = Math.round((careDay - birth()) / 864e5), N = careNorms(dAge);
  const feeds = list.filter(e => e.k === "feed"), ml = feeds.reduce((s, e) => s + e.ml, 0);
  const cnt = k => list.filter(e => e.k === k).length, sleepMin = list.filter(e => e.k === "sleep").reduce((s, e) => s + e.min, 0);
  let last = "";
  if (isToday && feeds.length) { const [h, m] = feeds[0].t.split(":").map(Number); const ago = Math.round((Date.now() - new Date(careDay.getFullYear(), careDay.getMonth(), careDay.getDate(), h, m)) / 6e4);
    if (ago >= 0) last = ` · 마지막 ${ago >= 60 ? `${Math.floor(ago / 60)}시간 ` : ""}${ago % 60}분 전`; }
  const low = ([min], v) => !isToday && list.length && min && v < min;   // only judge finished days
  const card = (k, v, sub, norm, warn) => el("div", { class: "metric" }, el("span", { class: "k", text: CARE_K[k] }), el("span", { class: "v", text: v }),
    sub ? el("span", { class: "n", text: sub }) : null, el("span", { class: "n" + (warn ? " warn" : ""), text: (warn ? "보통보다 적어요 · " : "보통 ") + norm }));
  $("#careSum").replaceChildren(
    card("feed", `${feeds.length}번`, (ml ? `총 ${ml}ml` : "") + last || null, N.feed[1], low(N.feed, feeds.length)),
    card("pee", `${cnt("pee")}번`, null, N.pee[1], low(N.pee, cnt("pee"))),
    card("poop", `${cnt("poop")}번`, null, N.poop[1], low(N.poop, cnt("poop"))),
    card("sleep", sleepMin ? `${Math.floor(sleepMin / 60)}시간 ${sleepMin % 60}분` : "0시간", null, N.sleep));
  const desc = e => e.k === "feed" ? `${FEED_T[e.ft] || "수유"}${e.ml ? ` ${e.ml}ml` : ""}${e.min ? ` ${e.min}분` : ""}`
    : e.k === "sleep" ? `잠 ${Math.floor(e.min / 60) ? Math.floor(e.min / 60) + "시간 " : ""}${e.min % 60}분` : CARE_K[e.k];
  const icon = { feed: "🍼", pee: "💧", poop: "💩", sleep: "😴" };
  $("#careList").replaceChildren(...list.map(e => el("div", { class: "rec" },
    el("span", { class: "d", text: e.t }), el("span", { text: `${icon[e.k]} ${desc(e)}` }),
    el("button", { type: "button", "aria-label": `${e.t} ${CARE_K[e.k]} 기록 지우기`, text: "지우기", onclick: () => careDelete(dayKey(careDay), e.id) }))));
  $("#careNote").textContent = !list.length ? (born ? "위 버튼을 누르면 바로 기록돼요. 엄마 아빠 휴대폰에 같이 보여요." : "태어나면 위 버튼으로 수유, 기저귀, 잠을 기록해 보세요. 엄마 아빠 휴대폰에 같이 보여요.")
    : `${N.ml}. 소변이 계속 적거나 잘 안 먹으면 소아과에 물어보세요.`;
}

function renderGrow() {
  if (location.hash !== "#grow") return;
  const t = today0(), ageDays = Math.round((t - birth()) / 864e5), born = ageDays >= 0, nowM = ageDays / 30.4375;
  $("#growSub").textContent = born ? `생후 ${ageDays + 1}일 · ${Math.floor(nowM)}개월` : `태어나기 ${-ageDays}일 전`;
  $("#growTitle").textContent = born ? `영웅이 생후 ${ageDays + 1}일` : "영웅이 기록";
  renderCare(ageDays, born);
  // milestones
  const cur = bandFor(born ? nowM : 0);
  if (!msBand) msBand = cur.id;

  $("#msBands").replaceChildren(...MILESTONES.map(b => el("button", { class: "stage", role: "tab", "aria-selected": String(b.id === band.id),
    onclick: () => { msBand = b.id; renderGrow(); } }, b.name, b.id === cur.id && born ? el("span", { class: "now", text: "지금" }) : null)));
  const items = band.groups.flatMap(([g, list]) => list.map((txt, i) => ({ id: `${band.id}-${g}-${i}`, g, txt })));
  const doneN = items.filter(x => growth.done[x.id]).length;
  $("#msTitle").textContent = `${band.name}쯤 많이 하는 것`;
  $("#msCount").textContent = `영웅이 ${doneN}/${items.length}`;
  $("#msIntro").textContent = band.id === cur.id && born ? "영웅이가 하는 걸 체크해 두면 가족과 함께 볼 수 있어요. 또래 대부분(약 75%)이 이 시기까지 하는 것들이에요." : "또래 대부분(약 75%)이 이 시기까지 하는 것들이에요. 미리 알아 두면 좋아요.";
  $("#msList").replaceChildren(...band.groups.map(([g, list]) => el("div", { class: "grp" }, el("h4", { text: g }),
    ...list.map((txt, i) => { const id = `${band.id}-${g}-${i}`, on = !!growth.done[id];
      const cb = el("input", { type: "checkbox", id: "ms-" + id, checked: on, disabled: !born });
      cb.addEventListener("change", () => { if (cb.checked) growth.done[id] = ymd(new Date()); else delete growth.done[id]; saveGrowth(); renderGrow(); });
      return el("label", { class: "check" + (on ? " done" : ""), for: "ms-" + id }, cb, el("span", { text: txt + (on ? ` (${growth.done[id].slice(5).replace("-", "/")})` : "") })); }))));

    el("ul", {},
      el("li", { text: `수유: ${N.feed[1]}. ${N.ml}. 모유는 아기가 원할 때마다 먹여요.` }),
      el("li", { text: `소변: ${N.pee[1]}` }),
      el("li", { text: `대변: ${N.poop[1]}` }),
      el("li", { text: `잠: ${N.sleep}` })));
  const pm = born ? nowM : 0, next = CHECKUPS.find(c => pm <= c[1]);
  if (next) info.append(el("p", { text: pm >= next[0] && born ? `지금 받을 때예요: ${next[2]}. 무료예요.` : `다음 검진: ${next[2]}. 무료로 받을 수 있어요.` }));

  $("#growSrcs").replaceChildren(...srcKeys.map(k => { const [n, u] = GROW_SRCS[k]; return el("li", {}, el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: n })); }));
}

function setupGrow() {
  document.querySelectorAll(".qadd button").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    if ((k === "pee" || k === "poop") && careDay?.getTime() === today0().getTime()) { careForm(null); careSave(dayKey(careDay), "e" + Date.now().toString(36), { k, t: hm(new Date()), ft: "", ml: 0, min: 0 }); return; }

// ---------- Share target (Android share sheet → 영웅이노트) ----------
let shareHandled = false;
async function maybeHandleShare() {
  if (shareHandled || !/[?&]share=1/.test(location.search)) return;
  shareHandled = true;
  try { history.replaceState(null, "", location.pathname); } catch {}
  let meta = null; const files = [];
  try {
    const c = await caches.open("yw-share");
    const mr = await c.match(new URL("shared/meta", location.href).href);
    if (mr) meta = await mr.json();
    for (const f of meta?.files || []) {
      const r = await c.match(f.key); if (!r) continue;
      const blob = await r.blob();
      files.push(new File([blob], f.name || "shared", { type: f.type || blob.type }));
    }
    for (const k of await c.keys()) await c.delete(k);
  } catch {}
  if (!meta) return;
  const all = [meta.url, meta.text, meta.title].join(" ");
  const link = (all.match(/https?:\/\/[^\s]+/) || [""])[0];
  const rest = [meta.title, meta.text].join("\n").replace(link, "").replace(/\n{2,}/g, "\n").trim();
  openAdd();
  if (link) $("#urlIn").value = link;
  if (rest && rest !== link) $("#txtIn").value = rest;
  linkHint();
  const vids = files.filter(f => f.type.startsWith("video/")), pics = files.filter(f => f.type.startsWith("image/"));
  if (pics.length) addImages(pics);
  if (vids.length) await addVideo(vids[0]);
  // Start right away when there is something Gemini can analyze.
  if (getKey() && (videoFile || ytUrl(link) || pics.length)) runAI();
  else if (isInsta(link) && !videoFile) setStatus("인스타 링크를 받았어요. 이 릴스의 공유 → '다운로드'로 영상을 저장한 뒤, 위의 '릴스 영상 올리기'로 골라 주세요. 갤러리에서 영상을 영웅이노트로 공유해도 돼요.");
}
